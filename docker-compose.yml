version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: messmate_postgres
    restart: always
    environment:
      POSTGRES_USER: messmate_user
      POSTGRES_PASSWORD: messmate_password
      POSTGRES_DB: messmate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messmate_user -d messmate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: messmate_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://messmate_user:messmate_password@db:5432/messmate_db
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      ENVIRONMENT: development
      DEBUG: "True"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: messmate_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyAA2zmMg5euc8i3aMuQ2N20Tf3_mgDb-JU
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: AIzaSyDfiMutHRcS2Q-5bI3fBD9PBk_hHVHua9E
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
