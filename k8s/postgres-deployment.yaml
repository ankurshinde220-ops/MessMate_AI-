apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: messmate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "messmate_user"
            - name: POSTGRES_PASSWORD
              value: "messmate_secure_pwd_change_in_prod"
            - name: POSTGRES_DB
              value: "messmate_db"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: messmate
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: messmate
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
